name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax (bash -n)
        run: for f in make-app.sh dockerctl.sh export-docker-run.sh; do bash -n "$f"; done
      - name: ShellCheck
        run: shellcheck -S warning -s bash make-app.sh dockerctl.sh export-docker-run.sh
