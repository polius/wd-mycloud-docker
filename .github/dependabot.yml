version: 2
updates:
  # GitHub Actions (SHA-pinned; Dependabot updates the SHA and the tag comment).
  # All updates (major, minor, patch) in one PR, merged by dependabot-auto-merge.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      actions:
        patterns:
          - "*"
